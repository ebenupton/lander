# ld65 configuration for the 32K build (b32/src/land.s): the whole machine.  L32M,
# loaded at $1900 by the loader, holds the program and its data to the land buffers
# ($5000); L32 is the loader (BOOT, $7000).  Everything else is made at the start:
# zero page; page 1 below a 64-byte stack (LOW1); $0206-$02FF past IRQ1V (LOW2);
# the ship's DBUF $0300; LAND's arrays $0400-$0CFF (land.s's) with LOWP in a gap;
# $0D00 an RTI, then LOWD; $0E00-$11FF the two STABs, $1200 the panel, $1480 MID
# (R7L, R7H), $1600 ENTL, ENTH, LAH, $1800 GLY (init's, glyphs').
MEMORY {
    ZP:   start = $0000, size = $00A0, type = rw, define = yes;
    LOW1: start = $0100, size = $00C0, type = rw, define = yes;
    LOW2: start = $0206, size = $00FA, type = rw, define = yes;
    LOWP: start = $0780, size = $0050, type = rw, define = yes;
    LOWD: start = $0D01, size = $00FF, type = rw, define = yes;
    MID:  start = $1480, size = $0180, type = rw, define = yes;
    HIB:  start = $1723, size = $00DD, type = rw, define = yes;
    MAIN: start = $1900, size = $3300, type = rw, file = "build32/L32M", fill = yes;
    MAPA: start = $4C00, size = $0400, type = rw, file = "build32/L32M";
    BOOT: start = $7000, size = $1000, type = rw, file = "build32/L32", fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOW1:     load = LOW1, type = bss;
    LOW2:     load = LOW2, type = bss;
    LOWP:     load = LOWP, type = bss;
    LOWD:     load = LOWD, type = bss;
    MID:      load = MID,  type = bss;
    HIB:      load = HIB,  type = bss;
    CODE:     load = MAIN, type = rw;
    FILLS:    load = MAIN, type = rw;
    GAME:     load = MAIN, type = rw;
    SHIP:     load = MAIN, type = rw;
    MAPD:     load = MAPA, type = rw;
    BOOT:     load = BOOT, type = rw;
}
