# ld65 configuration for the 32K build (b32/src/land.s): the whole machine, every byte
# below the land buffers accounted for.
#
# The program (L32M: the map, the panel, the code and its tables) runs from $1400 up,
# in one piece; DFS loads it at $1900 (its PAGE) and the loader (L32, BOOT at $7000,
# inside land buffer 1) copies it down once the MOS is gone.  The free memory is one
# block, from the program's end (__IMG_LAST__) to the land buffers at $5000.
#
# Everything uninitialised (zeroed by the loader) fills the holes the fixed layout
# leaves, each packed by hand (sizes in brackets; the linker checks they fit):
#   ZP     $00-$8C          zero page ($FC: the MOS ROM's IRQ entry stores A there):
#                           land.s's, with the hottest variables (zprank.py); $8D-$9F
#                           the walker's and the game's scratch (equates)
#   ZP2    $A0-$B6          more of the hottest; $B7-$FB equates (MT0, MT1, BCL, EYV,
#                           CAME; TX, BX, LO, HI: 16 each)
#   page 1 $0100-$01EC      P1L (the game's state, a dot array), P1T $0140 (LAHB), P1H
#                           (the ship's scratch); the stack above it, $01ED-$01FF: 19
#                           bytes, the main loop's 12 (b32/tools/stackdepth.py) + an
#                           IRQ's 4 + an NMI's 3
#   page 2 $0206-$02FF      P2L (LB), P2T $0240 (free: 97), P2H (the ship's scratch)
#                           ($0200: run's first put-back; $0204/5: IRQ1V)
#                           (each line table at offset $40..$9F of its page: indexed by
#                           a line YSKY..YGND+1 from the table less YSKY, it never
#                           crosses a page)
#   (fixed) $0300-$0CFF     DBUF, ROWA, ROWB, RTBUF, PX, PY, HT, CLE, CLO, the strips'
#                           arrays (TY .. CX $0A40-$0ACF), CURT, CURB, TOPS, BOTS (land.s's
#                           equates), with LOWP $0780 (4 dot arrays), G1A $07EB (21:
#                           PATON), G1B $0AD0 (144: PATN, PATF) in its gaps
#   $0D00                   an RTI: the NMI's (the MOS ROM's NMI vector points here)
#   page $0D $0D01-$0DFF    LDL (KTN, flip's), LDT $0D40 (OLB), LDH (the ship's scratch)
#   STAB   $0E00-$11FF      init's four parity tables (land.s: PTN 147 bytes each, one at
#                           the start of each page; free after them, but SG0 $0FB5 (BYN,
#                           the ship's scratch) and SG1 $11B5 (LIM, the projection's))
#   GA0    $1200-$12FF      R7L (176) and 4 dot arrays
#   GA1    $1300-$13FF      R7H (176) and 4 dot arrays
#   IMG    $1400-           MAP32 ($400-aligned: its pages are ORed), PANEL (page
#                           aligned), FILLS (after the panel: at a fixed address, so
#                           TEN4H and TEN5H keep sharing a page), CODE, GAME, SHIP
MEMORY {
    ZP:   start = $0000, size = $008D, type = rw, define = yes;
    ZP2:  start = $00A0, size = $0017, type = rw;
    P1L:  start = $0100, size = $0040, type = rw;
    P1T:  start = $0140, size = $0061, type = rw;
    P1H:  start = $01A1, size = $004C, type = rw, define = yes;
    P2L:  start = $0206, size = $003A, type = rw;
    P2T:  start = $0240, size = $0061, type = rw;
    P2H:  start = $02A1, size = $005F, type = rw;
    LOWP: start = $0780, size = $0050, type = rw;
    G1A:  start = $07EB, size = $0015, type = rw;
    G1B:  start = $0AD0, size = $0090, type = rw;
    LDL:  start = $0D01, size = $003F, type = rw;
    LDT:  start = $0D40, size = $0062, type = rw;
    LDH:  start = $0DA2, size = $005E, type = rw;
    SG0:  start = $0FB5, size = $004B, type = rw;
    SG1:  start = $11B5, size = $004B, type = rw;
    GA0:  start = $1200, size = $0100, type = rw;
    GA1:  start = $1300, size = $0100, type = rw;
    IMG:  start = $1400, size = $3C00, type = rw, file = "build32/L32M", define = yes;
    BOOT: start = $7000, size = $1000, type = rw, file = "build32/L32", fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    ZP2:      load = ZP2,  type = zp;
    P1L:      load = P1L,  type = bss;
    P1T:      load = P1T,  type = bss;
    P1H:      load = P1H,  type = bss;
    P2L:      load = P2L,  type = bss;
    P2H:      load = P2H,  type = bss;
    LOWP:     load = LOWP, type = bss;
    G1A:      load = G1A,  type = bss;
    G1B:      load = G1B,  type = bss;
    LDL:      load = LDL,  type = bss;
    LDT:      load = LDT,  type = bss;
    LDH:      load = LDH,  type = bss;
    SG0:      load = SG0,  type = bss;
    SG1:      load = SG1,  type = bss;
    GA0:      load = GA0,  type = bss;
    GA1:      load = GA1,  type = bss;
    MAPD:     load = IMG,  type = rw, align = $400;
    PANELD:   load = IMG,  type = rw, align = $100;
    FILLS:    load = IMG,  type = rw;
    CODE:     load = IMG,  type = rw;
    GAME:     load = IMG,  type = rw;
    SHIP:     load = IMG,  type = rw;
    BOOT:     load = BOOT, type = rw;
}
