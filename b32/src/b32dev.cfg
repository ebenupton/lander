# ld65 configuration for the 32K build in its development stage (b32/src/land.s): the
# renderer in main RAM; what is still to be cut down lives above $8000, where only
# py65 has memory: bank 4's table image at $8000 (build32/TABLES, gen32's) and
# traceb's fills (FILLS) at $C000.
MEMORY {
    ZP:   start = $0000, size = $00A0, type = rw, define = yes;
    LOAD: start = $1900, size = $1F00, type = rw, file = %O, fill = no;
    FILLS: start = $C000, size = $0800, type = rw, file = "build32/FILLS", fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    CODE:     load = LOAD,  type = rw;
    FILLS:    load = FILLS, type = rw, align = $100;
}
