# ld65 configuration for the 32K build in its development stage (b32/src/land.s): the
# main area is the machine's RAM from $1900 to the land buffers ($5000); what does
# not fit there yet goes above $8000, where only py65 has memory (DEV).
MEMORY {
    ZP:   start = $0000, size = $00A0, type = rw, define = yes;
    MAIN: start = $1900, size = $3700, type = rw, file = %O, fill = yes;
    BOOT: start = $7000, size = $1000, type = rw, file = "build32/BOOT", fill = no;
    DEV:  start = $8000, size = $8000, type = rw, file = "build32/DEV", fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = rw;
    MAPD:     load = MAIN, type = rw, align = $400;
    FILLS:    load = MAIN, type = rw, align = $100;
    GAME:     load = DEV,  type = rw;
    BOOT:     load = BOOT, type = rw;
}
