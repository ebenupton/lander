# The sideways RAM build's link: data from zero page up (page $0D left to the MOS), the
# code ending at the screens, the two screens from $3000; and the banks' code.
# __PROG__ (the code's start) is set by build32.sh from the code's size, so that it ends
# exactly at $2800, where run's eight store pages (init makes them) run up to the
# screens, code in the first $6F bytes of each (T0 .. T7).  ramswr.s lays out the data by address (.org); the stored tables (TABLES)
# follow it.  LAND holds the stored parts, loaded at $3000 through the screens; LANDER,
# the loader, runs at $7000.  B4CODE, B7CODE: the code of banks 4 and 7, merged into
# their images (gen32.py's tables) by mergebank.py (B4CODE's file holds B4BODY too, a
# page on), B5CODE.
SYMBOLS {
    __PROG__: type = weak, value = $2000;
}
MEMORY {
    ZP:     start = $0000, size = $00FC, file = "";
    PAGE1:  start = $0100, size = $0100, file = "";
    PAGE2:  start = $0200, size = $0100, file = "";
    DATA1:  start = $0300, size = $0A00, file = "";
    DATA:   start = $0E00, size = __PROG__ - $0E00, define = yes, file = "";
    PROG:   start = __PROG__, size = $2800 - __PROG__, define = yes, file = "";
    S0:     start = $2800, size = $006F, file = "";
    S1:     start = $2900, size = $006F, file = "";
    S2:     start = $2A00, size = $006F, file = "";
    S3:     start = $2B00, size = $006F, file = "";
    S4:     start = $2C00, size = $006F, file = "";
    S5:     start = $2D00, size = $006F, file = "";
    S6:     start = $2E00, size = $006F, file = "";
    S7:     start = $2F00, size = $006F, file = "";
    SCREEN: start = $3000, size = $5000, file = "";
    FILE:   start = $3000, size = $4000, file = "buildswr/LAND";
    BOOTM:  start = $7000, size = $1000, file = "buildswr/LANDER";
    B4:     start = $B000, size = $0800, file = "buildswr/B4CODE";
    B5:     start = $A000, size = $2000, file = "buildswr/B5CODE";
    B7:     start = $B480, size = $0A20, file = "buildswr/B7CODE";
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    PAGE1:    load = PAGE1,  type = bss;
    PAGE2:    load = PAGE2,  type = bss;
    RAM:      load = DATA1,  type = bss;
    RAM2:     load = DATA,   type = bss;
    TABLES:   load = FILE,   run = DATA, type = rw, define = yes;
    CODE:     load = FILE,   run = PROG, type = rw, define = yes;
    T0:       load = FILE,   run = S0,   type = rw, define = yes;
    T1:       load = FILE,   run = S1,   type = rw, define = yes;
    T2:       load = FILE,   run = S2,   type = rw, define = yes;
    T3:       load = FILE,   run = S3,   type = rw, define = yes;
    T4:       load = FILE,   run = S4,   type = rw, define = yes;
    T5:       load = FILE,   run = S5,   type = rw, define = yes;
    T6:       load = FILE,   run = S6,   type = rw, define = yes;
    T7:       load = FILE,   run = S7,   type = rw, define = yes;
    SCREEN:   load = SCREEN, type = bss;
    BOOT:     load = BOOTM,  type = rw,  define = yes;
    B4CODE:   load = B4,     type = rw;
    B4BODY:   load = B4,     type = rw, align = $100;
    B5CODE:   load = B5,     type = rw;
    B7CODE:   load = B7,     type = rw;
}
