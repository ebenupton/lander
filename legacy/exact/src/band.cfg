# BAND: loaded and run at $1900 (PAGE under DFS); everything it builds at run time lives
# in $4800-$57FF, $0400-$07FF and $0C00, under the narrow screen at $5800 (main.s).  Zero page: the language's.
MEMORY {
    ZP:   start = $0010, size = $0080, type = rw, define = yes;
    LOAD: start = $1900, size = $2F00, type = rw, file = %O, fill = no, define = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = LOAD, type = rw;
    RODATA:   load = LOAD, type = ro;
}
