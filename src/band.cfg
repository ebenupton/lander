# BAND: loaded and run at $1900 (PAGE under DFS), its code to $4C00 and LOW1-3 after it, copied down at the
# start.  Everything it builds at run time: main.s's memory map.  Zero page: the
# language's.
MEMORY {
    ZP:   start = $0010, size = $0080, type = rw, define = yes;
    LOAD: start = $1900, size = $3900, type = rw, file = %O, fill = no, define = yes;
    LOW1: start = $0900, size = $0200, type = rw, file = "";
    LOW2: start = $0B00, size = $0100, type = rw, file = "";
    LOW3: start = $0CA1, size = $005F, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = LOAD, type = rw, align = $100;   # (TOPPG: .align 256)
    RODATA:   load = LOAD, type = ro, align = 32;
    LOW1:     load = LOAD, run = LOW1, type = ro, define = yes;
    LOW2:     load = LOAD, run = LOW2, type = ro, define = yes;
    LOW3:     load = LOAD, run = LOW3, type = ro, define = yes;
    ZPCODE:   load = LOAD, run = ZP, type = rw, define = yes;
}
