# LAND: loaded at $1900 (PAGE under DFS), up to the screens at $3000; LANDS, its start
# (run once, from screen 1's last 4K, before init clears the screens), at $7000.
MEMORY {
    ZP:   start = $0000, size = $00A0, type = rw, define = yes;   # (and Econet's $90-$9F: none here)
    LOAD: start = $1900, size = $1700, type = rw, file = %O, fill = no;
    BOOT: start = $7000, size = $1000, type = rw, file = "build/land/LANDS", fill = no;
    B4V1: start = $B600, size = $006F, type = rw, file = "build/land/B4V1", fill = no;   # (into TABLES)
    B4V2: start = $B700, size = $006F, type = rw, file = "build/land/B4V2", fill = no;   # (into TABLES)
    B4V3: start = $B800, size = $006F, type = rw, file = "build/land/B4V3", fill = no;   # (into TABLES)
    B5:   start = $A000, size = $1C00, type = rw, file = "build/land/B5CODE", fill = no;  # (into TABLES2)
    B4C:  start = $A181, size = $007F, type = rw, file = "build/land/B4C", fill = no;   # (into TABLES)
    B4R:  start = $9000, size = $006F, type = rw, file = "build/land/B4R", fill = no;   # (into TABLES)
    B4L:  start = $9100, size = $006F, type = rw, file = "build/land/B4L", fill = no;   # (into TABLES)
    B5G:  start = $A100, size = $1D00, type = rw, file = "build/land/B5GAME", fill = no;  # (into TABLES2: the game)
    B4S:  start = $A081, size = $007F, type = rw, file = "build/land/B4S", fill = no;   # (into TABLES)
    B4S2: start = $9200, size = $006F, type = rw, file = "build/land/B4S2", fill = no;   # (into TABLES)
    B7:   start = $B900, size = $0700, type = rw, file = "build/land/B7CODE", fill = no;  # (into TABLES7)
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = LOAD, type = rw;
    BOOT:     load = BOOT, type = rw;
    B4V1:      load = B4V1, type = rw;
    B4V2:      load = B4V2, type = rw;
    B4V3:      load = B4V3, type = rw;
    B5CODE:   load = B5, type = rw;
    B4C:       load = B4C, type = rw;
    B4R:       load = B4R, type = rw;
    B4L:       load = B4L, type = rw;
    B7CODE:   load = B7, type = rw;
    B4S:       load = B4S, type = rw;
    B4S2:      load = B4S2, type = rw;
    B5GAME:   load = B5G, type = rw;
}
