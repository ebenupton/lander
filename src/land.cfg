# ld65 configuration for src/land.s: LAND (main RAM), LANDS (the start-up) and the
# code that lives in sideways banks 4, 5 and 7.  Each bank segment is linked at its
# final address into its own file, which tools/mergebank.py copies into the bank's
# table image (build/TABLES, TABLES2, TABLES7) at that address, checking the space is
# free; build.sh lists which segment goes into which image.
#
# Main RAM: LAND loads at $1900 (PAGE under DFS) and must end below $2F00, where bank
# 6 keeps its decode buffer (DBUF, src/shipspan.s); the screens follow at $3000.
# LANDS runs once from $7000, inside screen 1, before init clears the screens.
# Zero page: $00-$9F ($90-$9F is the MOS's Econet space, unused on this machine).
MEMORY {
    ZP:   start = $0000, size = $00A0, type = rw, define = yes;
    LOAD: start = $1900, size = $1600, type = rw, file = %O, fill = no;
    BOOT: start = $7000, size = $1000, type = rw, file = "build/LANDS", fill = no;

    # bank 4 (TABLES): small pieces in the gaps the tables leave
    B4R:  start = $9000, size = $006F, type = rw, file = "build/B4R", fill = no;   # rungs' fast way
    B4L:  start = $9100, size = $006F, type = rw, file = "build/B4L", fill = no;   # rungs' fast way
    B4S2: start = $9200, size = $006F, type = rw, file = "build/B4S2", fill = no;  # the slow way
    B4S:  start = $A081, size = $007F, type = rw, file = "build/B4S", fill = no;   # the slow way
    B4C:  start = $A181, size = $007F, type = rw, file = "build/B4C", fill = no;   # rungs' fast way
    B4V1: start = $B600, size = $006F, type = rw, file = "build/B4V1", fill = no;  # s2v
    B4V2: start = $B700, size = $006F, type = rw, file = "build/B4V2", fill = no;  # s2v
    B4V3: start = $B800, size = $006F, type = rw, file = "build/B4V3", fill = no;  # s2v
    B4Z:  start = $B900, size = $006F, type = rw, file = "build/B4Z", fill = no;   # the slow way

    # bank 5 (TABLES2): the tile colours' code, then the game from $A100 up to GLY5
    # ($BE00), where LANDS writes the game's letters
    B5:   start = $A000, size = $0100, type = rw, file = "build/B5CODE", fill = no;
    B5G:  start = $A100, size = $1D00, type = rw, file = "build/B5GAME", fill = no;

    # bank 7 (TABLES7): the projection's code, and small pieces in the spare ends of
    # the R7L, R7H, CLP7, PINL7 and PINR7 tables (entries di >= NDI are never read)
    B7A:  start = $80B0, size = $0050, type = rw, file = "build/B7A", fill = no;
    B7B:  start = $81B0, size = $0050, type = rw, file = "build/B7B", fill = no;
    B7E:  start = $AEB0, size = $0050, type = rw, file = "build/B7E", fill = no;
    B7C:  start = $AFB0, size = $0050, type = rw, file = "build/B7C", fill = no;
    B7D:  start = $B0B0, size = $0050, type = rw, file = "build/B7D", fill = no;
    B7:   start = $B480, size = $0A20, type = rw, file = "build/B7CODE", fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = LOAD, type = rw;
    BOOT:     load = BOOT, type = rw;
    B4R:      load = B4R,  type = rw;
    B4L:      load = B4L,  type = rw;
    B4S2:     load = B4S2, type = rw;
    B4S:      load = B4S,  type = rw;
    B4C:      load = B4C,  type = rw;
    B4V1:     load = B4V1, type = rw;
    B4V2:     load = B4V2, type = rw;
    B4V3:     load = B4V3, type = rw;
    B4Z:      load = B4Z,  type = rw;
    B5CODE:   load = B5,   type = rw;
    B5GAME:   load = B5G,  type = rw;
    B7A:      load = B7A,  type = rw;
    B7B:      load = B7B,  type = rw;
    B7E:      load = B7E,  type = rw;
    B7C:      load = B7C,  type = rw;
    B7D:      load = B7D,  type = rw;
    B7CODE:   load = B7,   type = rw;
}
