# LAND: loaded at $1900 (PAGE under DFS), up to the screens at $3000; LANDS, its start
# (run once, from screen 1's last 4K, before init clears the screens), at $7000.
MEMORY {
    ZP:   start = $0000, size = $00A0, type = rw, define = yes;   # (and Econet's $90-$9F: none here)
    LOAD: start = $1900, size = $1700, type = rw, file = %O, fill = no;
    BOOT: start = $7000, size = $1000, type = rw, file = "build/land/LANDS", fill = no;
    B4V1: start = $B600, size = $0048, type = rw, file = "build/land/B4V1", fill = no;   # (into TABLES)
    B4V2: start = $B700, size = $0034, type = rw, file = "build/land/B4V2", fill = no;   # (into TABLES)
    B4V3: start = $B800, size = $0043, type = rw, file = "build/land/B4V3", fill = no;   # (into TABLES)
    B5:   start = $A000, size = $1C00, type = rw, file = "build/land/B5CODE", fill = no;  # (into TABLES2)
    B4C:  start = $A181, size = $007F, type = rw, file = "build/land/B4C", fill = no;   # (into TABLES)
    B4R:  start = $9000, size = $006F, type = rw, file = "build/land/B4R", fill = no;   # (into TABLES)
    B4L:  start = $9100, size = $006F, type = rw, file = "build/land/B4L", fill = no;   # (into TABLES)
    B5G:  start = $A100, size = $1D00, type = rw, file = "build/land/B5GAME", fill = no;  # (into TABLES2: the game)
    B4S:  start = $A081, size = $007F, type = rw, file = "build/land/B4S", fill = no;   # (into TABLES)
    B4Z:  start = $B900, size = $003A, type = rw, file = "build/land/B4Z", fill = no;   # (into TABLES)
    B4G:  start = $B734, size = $003B, type = rw, file = "build/land/B4G", fill = no;   # (into TABLES)
    B4H:  start = $B93A, size = $0035, type = rw, file = "build/land/B4H", fill = no;   # (into TABLES)
    B4G1: start = $B648, size = $0027, type = rw, file = "build/land/B4G1", fill = no;   # (into TABLES)
    B4G2: start = $B843, size = $002C, type = rw, file = "build/land/B4G2", fill = no;   # (into TABLES)
    B4S2: start = $9200, size = $006F, type = rw, file = "build/land/B4S2", fill = no;   # (into TABLES)
    B7A:  start = $80B0, size = $0050, type = rw, file = "build/land/B7A", fill = no;   # (into TABLES7: R7L's spare)
    B7B:  start = $81B0, size = $0050, type = rw, file = "build/land/B7B", fill = no;   # (into TABLES7: R7H's spare)
    B7C:  start = $AFB0, size = $0050, type = rw, file = "build/land/B7C", fill = no;   # (into TABLES7: PINL7's spare)
    B7D:  start = $B0B0, size = $0050, type = rw, file = "build/land/B7D", fill = no;   # (into TABLES7: PINR7's spare)
    B7:   start = $B480, size = $0A20, type = rw, file = "build/land/B7CODE", fill = no;  # (into TABLES7)
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = LOAD, type = rw;
    BOOT:     load = BOOT, type = rw;
    B4V1:      load = B4V1, type = rw;
    B4V2:      load = B4V2, type = rw;
    B4V3:      load = B4V3, type = rw;
    B5CODE:   load = B5, type = rw;
    B4C:       load = B4C, type = rw;
    B4R:       load = B4R, type = rw;
    B4L:       load = B4L, type = rw;
    B7CODE:   load = B7, type = rw;
    B7A:      load = B7A, type = rw;
    B7B:      load = B7B, type = rw;
    B7C:      load = B7C, type = rw;
    B7D:      load = B7D, type = rw;
    B4S:       load = B4S, type = rw;
    B4S2:      load = B4S2, type = rw;
    B4Z:       load = B4Z, type = rw;
    B4G:       load = B4G, type = rw;
    B4H:       load = B4H, type = rw;
    B4G1:      load = B4G1, type = rw;
    B4G2:      load = B4G2, type = rw;
    B5GAME:   load = B5G, type = rw;
}
