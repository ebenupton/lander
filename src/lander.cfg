# The 32K build's link: data from zero page up, the code ending at the screen, the
# screen.  __PROG__ (the code's start) is set by build.sh from the code's size, so
# that the code ends exactly at $4900, where the parity tables' four pages and their
# code tails run up to the panel at $4D40.  ram.s lays out the data by address
# (.org); the stored tables (TABLES) follow it.  BASE, the file, holds the stored
# parts in this order and the start-up code (BOOT) last; it loads at $2000.
SYMBOLS {
    __PROG__: type = weak, value = $1C00;
}
MEMORY {
    ZP:     start = $0000, size = $00FC, file = "";
    PAGE1:  start = $0100, size = $0100, file = "";
    PAGE2:  start = $0200, size = $0100, file = "";
    DATA:   start = $0300, size = __PROG__ - $0300, define = yes, file = "";
    PROG:   start = __PROG__, size = $4900 - __PROG__, define = yes, file = "";
    S0:     start = $4900, size = $0100, file = "";
    S1:     start = $4A00, size = $0100, file = "";
    S2:     start = $4B00, size = $0100, file = "";
    S3:     start = $4C00, size = $0100, file = "";
    S4:     start = $4D00, size = $0040, file = "";
    SCREEN: start = $4D40, size = $32C0, file = "";
    FILE:   start = $2000, size = $5C00, file = "BUILD/BASE";
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    PAGE1:    load = PAGE1,  type = bss;
    PAGE2:    load = PAGE2,  type = bss;
    RAM:      load = DATA,   type = bss;
    TABLES:   load = FILE,   run = DATA, type = rw, define = yes;
    FILLS:    load = PROG,   type = bss;
    CODE:     load = FILE,   run = PROG, type = rw, define = yes;
    STAB0:    load = S0,     type = bss;
    T0:       load = FILE,   run = S0,   type = rw, define = yes;
    STAB1:    load = S1,     type = bss;
    T1:       load = FILE,   run = S1,   type = rw, define = yes;
    STAB2:    load = S2,     type = bss;
    T2:       load = FILE,   run = S2,   type = rw, define = yes;
    STAB3:    load = S3,     type = bss;
    T3:       load = FILE,   run = S3,   type = rw, define = yes;
    T4:       load = FILE,   run = S4,   type = rw, define = yes;
    SCREEN:   load = SCREEN, type = bss;
    BOOT:     load = FILE,   type = rw,  define = yes;
}
