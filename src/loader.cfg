# The link of src/loader.s: !BOOT, one file loaded and run at $7000, below MODE 7's
# screen ($7C00) and above everything it loads.
MEMORY {
    MAIN: start = $7000, size = $0C00, file = %O;
}
SEGMENTS {
    CODE:   load = MAIN, type = rw;
    RODATA: load = MAIN, type = rw;
    DATA:   load = MAIN, type = rw;
}
