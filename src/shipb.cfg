# ld65 configuration for src/shipb.s: SHIPB, the ship in sideways bank 6, one 16K
# image loaded at $8000.  CODE (the entry jumps, keys, the span walker and decoder and
# its tables) is page aligned; SPANS (the compressed orientations, shipspan.inc)
# follows it; TAIL (the decoder) and DTAB (the decoder's nibble tables and the
# walker's pixel tables) each start a page (shipspan.s asserts their placement
# within them).  The decode buffer is not here: it is DBUF at $2F00 in main RAM.
MEMORY {
    LOAD: start = $8000, size = $4000, type = rw, file = %O, fill = no;
}
SEGMENTS {
    CODE:     load = LOAD, type = rw, align = $100;
    SPANS:    load = LOAD, type = rw;
    TAIL:     load = LOAD, type = rw, align = $100;
    DTAB:     load = LOAD, type = rw, align = $100;
}
