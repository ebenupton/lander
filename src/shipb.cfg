# ld65 configuration for src/shipb.s: SHIPB, the ship in sideways bank 6, one 16K
# image loaded at $8000.  CODE (the entry jumps, keys, the span walker and decoder and
# its tables) is page aligned; SPANS (the compressed orientations, shipspan.inc) and
# TAIL follow it; DTAB, the decoder's nibble tables and the walker's u tables, must
# start a page (shipspan.s asserts their placement within it).  The decode buffer is
# not here: it is DBUF at $2F00 in main RAM.
MEMORY {
    LOAD: start = $8000, size = $4000, type = rw, file = %O, fill = no;
}
SEGMENTS {
    CODE:     load = LOAD, type = rw, align = $100;
    SPANS:    load = LOAD, type = rw;
    TAIL:     load = LOAD, type = rw;
    DTAB:     load = LOAD, type = rw, align = $100;
}
