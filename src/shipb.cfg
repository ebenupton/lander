# The link of src/shipb.s: the ship, the sideways RAM build's bank 6, one 16K image
# that runs at $8000 (the file B6).  CODE (the entry jumps, keys, ship, the span
# walker and its tables, FCE, FCX) is page aligned; SPANS (the compressed
# orientations, shipspan.inc) follows it; TAIL (the decoder) and DTAB (the decoder's
# nibble tables and the walker's pixel tables) each start a page (shipspan.s asserts
# their placement within them).  The decode buffer is DBUF, in main RAM (ram.s).
MEMORY {
    LOAD: start = $8000, size = $4000, type = rw, file = %O, fill = no;
}
SEGMENTS {
    CODE:     load = LOAD, type = rw, align = $100;
    SPANS:    load = LOAD, type = rw;
    TAIL:     load = LOAD, type = rw, align = $100;
    DTAB:     load = LOAD, type = rw, align = $100;
}
